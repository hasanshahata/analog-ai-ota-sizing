<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTA Sizing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>OTA Sizing</h1>
    <p class="sub">Ideal-tail 5T · TSMC 65 nm · nominal TT · VDD 1.2 V</p>
  </header>

  <div id="engine-status" class="statusline" aria-live="polite">
    <span id="engine-dot" class="dot dot-loading" aria-hidden="true"></span>
    <span id="engine-text">checking engine…</span>
  </div>

  <form id="size-form" novalidate>
    <div class="grid">
      <div class="field">
        <label for="gain">Min gain</label>
        <div class="inputrow">
          <input id="gain" type="number" inputmode="decimal"
                 min="20" max="45" step="0.1" value="35" required>
          <span class="unit">dB</span>
        </div>
      </div>
      <div class="field">
        <label for="gbw">Min GBW</label>
        <div class="inputrow">
          <input id="gbw" type="number" inputmode="decimal"
                 min="50" max="300" step="0.1" value="100" required>
          <span class="unit">MHz</span>
        </div>
      </div>
      <div class="field">
        <label for="cl">Load</label>
        <div class="inputrow">
          <input id="cl" type="number" inputmode="decimal"
                 min="0.1" max="5" step="0.01" value="1" required>
          <span class="unit">pF</span>
        </div>
      </div>
      <div class="field">
        <label for="power">Max power</label>
        <div class="inputrow">
          <input id="power" type="number" inputmode="decimal"
                 min="50" max="400" step="0.1" value="200" required>
          <span class="unit">µW</span>
        </div>
      </div>
    </div>
    <div class="actions">
      <button id="submit" type="submit">Size</button>
      <span id="progress" class="progress" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="progress-text">0 s</span>
      </span>
    </div>
  </form>

  <section id="result" aria-live="polite" aria-busy="false"></section>
</main>
<script src="app.js"></script>
</body>
</html>
