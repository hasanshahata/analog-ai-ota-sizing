<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog AI Optimizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <h1>Analog AI <span class="gradient-text">Optimizer</span></h1>
            </div>
            <p class="subtitle">AI-driven 65nm OTA Sizing Engine powered by Reinforcement Learning</p>
        </header>

        <main>
            <section class="glass-panel input-panel">
                <h2>Target Specifications</h2>
                <form id="specs-form">
                    <div class="input-grid">
                        <div class="input-group">
                            <label for="gain">Gain (dB) <span class="badge">Max</span></label>
                            <input type="number" id="gain" name="Gain_min" step="0.1" value="40.0" required>
                        </div>
                        <div class="input-group">
                            <label for="gbw">GBW (MHz) <span class="badge">Max</span></label>
                            <input type="number" id="gbw" name="GBW_min" step="1" value="200" required>
                        </div>
                        <div class="input-group">
                            <label for="pm">Phase Margin (Deg) <span class="badge">Max</span></label>
                            <input type="number" id="pm" name="PM_min" step="0.1" value="60.0" required>
                        </div>
                        <div class="input-group">
                            <label for="power">Power (uW) <span class="badge badge-min">Min</span></label>
                            <input type="number" id="power" name="Power_max" step="1" value="150" required>
                        </div>
                        <div class="input-group">
                            <label for="sr">Slew Rate (V/us) <span class="badge">Max</span></label>
                            <input type="number" id="sr" name="SR_min" step="0.1" value="50.0" required>
                        </div>
                        <div class="input-group">
                            <label for="swing">Output Swing (V) <span class="badge">Max</span></label>
                            <input type="number" id="swing" name="Swing_min" step="0.01" value="0.8" required>
                        </div>
                        <div class="input-group">
                            <label for="icmr">ICMR Min (V) <span class="badge badge-min">Min</span></label>
                            <input type="number" id="icmr" name="ICMR_max" step="0.01" value="0.4" required>
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" class="glow-button">
                        <span class="btn-text">Generate Sizing</span>
                        <div class="spinner hidden"></div>
                    </button>
                </form>
            </section>

            <section class="glass-panel output-panel hidden" id="output-section">
                <h2>Optimization Results</h2>
                
                <div class="results-grid">
                    <div class="result-card sizing-card">
                        <h3>Circuit Sizing</h3>
                        <div class="sizing-details" id="sizing-details">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <div class="result-card perf-card">
                        <h3>Achieved Performance</h3>
                        <div class="perf-details" id="perf-details">
                             <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
